<script>
  (function () {
    "use strict";

    function updateSiteStats() {
      var requestsEl = document.getElementById("recent_requests");
      var starsEl = document.getElementById("total_github_stars");
      if ((!requestsEl && !starsEl) || !window.fetch) return;

      function fetchStats(path) {
        return fetch(path, {
          cache: "no-store",
          headers: { Accept: "application/json" }
        })
        .then(function (response) {
          if (!response.ok) throw new Error("Site statistics request failed");
          return response.json();
        });
      }

      if (requestsEl) {
        fetchStats("{{ '/assets/data/visits.json' | relative_url }}")
          .then(function (data) {
            if (typeof data.requests !== "number") throw new Error("Request statistics response is invalid");
            requestsEl.textContent = new Intl.NumberFormat().format(data.requests);
          })
          .catch(function () {
            requestsEl.textContent = "—";
          });
      }

      if (starsEl) {
        fetchStats("{{ '/assets/data/github-stars.json' | relative_url }}")
          .then(function (data) {
            if (typeof data.githubStars !== "number") throw new Error("GitHub Stars response is invalid");
            starsEl.textContent = new Intl.NumberFormat().format(data.githubStars);
          })
          .catch(function () {
            starsEl.textContent = "—";
          });
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", updateSiteStats, { once: true });
    } else {
      updateSiteStats();
    }
  }());
</script>
