<script>
  (function () {
    "use strict";

    function updateSiteStats() {
      var visitsEl = document.getElementById("recent_visits");
      var starsEl = document.getElementById("total_github_stars");
      if ((!visitsEl && !starsEl) || !window.fetch) return;

      fetch("{{ '/assets/data/visits.json' | relative_url }}", {
        cache: "no-store",
        headers: { Accept: "application/json" }
      })
        .then(function (response) {
          if (!response.ok) throw new Error("Site statistics request failed");
          return response.json();
        })
        .then(function (data) {
          if (!data) throw new Error("Site statistics response is invalid");
          if (visitsEl && typeof data.visits === "number") {
            visitsEl.textContent = new Intl.NumberFormat().format(data.visits);
          }
          if (starsEl && typeof data.githubStars === "number") {
            starsEl.textContent = new Intl.NumberFormat().format(data.githubStars);
          }
        })
        .catch(function () {
          if (visitsEl) visitsEl.textContent = "—";
          if (starsEl) starsEl.textContent = "—";
        });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", updateSiteStats, { once: true });
    } else {
      updateSiteStats();
    }
  }());
</script>
