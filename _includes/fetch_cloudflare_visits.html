<script>
  (function () {
    "use strict";

    function updateVisits() {
      var visitsEl = document.getElementById("recent_visits");
      if (!visitsEl || !window.fetch) return;

      fetch("{{ '/assets/data/visits.json' | relative_url }}", {
        cache: "no-store",
        headers: { Accept: "application/json" }
      })
        .then(function (response) {
          if (!response.ok) throw new Error("Visit statistics request failed");
          return response.json();
        })
        .then(function (data) {
          if (!data || typeof data.visits !== "number") {
            throw new Error("Visit statistics response is invalid");
          }
          visitsEl.textContent = new Intl.NumberFormat().format(data.visits);
        })
        .catch(function () {
          visitsEl.textContent = "—";
        });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", updateVisits, { once: true });
    } else {
      updateVisits();
    }
  }());
</script>
