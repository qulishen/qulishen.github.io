name: Update Cloudflare Visits

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-commit
  cancel-in-progress: false

jobs:
  update-visits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Cloudflare visits
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUDFLARE_ZONE_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "CLOUDFLARE_ZONE_ID must be the 32-character Zone ID for qulishen.top." >&2
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "CLOUDFLARE_API_TOKEN is not configured." >&2
            exit 1
          fi

          query='query DailyVisits($zoneTag: string, $start: Time, $end: Time) {
            viewer {
              zones(filter: { zoneTag: $zoneTag }) {
                httpRequestsAdaptiveGroups(
                  limit: 1
                  filter: {
                    datetime_geq: $start
                    datetime_lt: $end
                    requestSource: "eyeball"
                  }
                ) {
                  sum {
                    visits
                  }
                }
              }
            }
          }'
          period_days=7
          today="$(date --utc '+%Y-%m-%d')"
          visits_total=0

          for day_offset in $(seq "$period_days" -1 1); do
            start="$(date --utc --date="${today} -${day_offset} days" '+%Y-%m-%dT00:00:00Z')"
            end="$(date --utc --date="${today} -$((day_offset - 1)) days" '+%Y-%m-%dT00:00:00Z')"
            payload="$(jq -n \
              --arg query "$query" \
              --arg zoneTag "$CLOUDFLARE_ZONE_ID" \
              --arg start "$start" \
              --arg end "$end" \
              '{query: $query, variables: {zoneTag: $zoneTag, start: $start, end: $end}}')"
            if ! response="$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-delay 2 --retry-all-errors --max-time 30 \
              --request POST "https://api.cloudflare.com/client/v4/graphql" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload")"; then
              printf '%s\n' "$response" >&2
              exit 1
            fi
            if jq --exit-status '.errors and (.errors | length > 0)' <<< "$response" >/dev/null; then
              echo "Cloudflare visit query failed for ${start} to ${end}." >&2
              jq '{errors}' <<< "$response" >&2
              exit 1
            fi
            if ! jq --exit-status '.data.viewer.zones | length == 1' <<< "$response" >/dev/null; then
              echo "Cloudflare returned no accessible zone; check CLOUDFLARE_ZONE_ID and token scope." >&2
              jq '{data}' <<< "$response" >&2
              exit 1
            fi
            if ! jq --exit-status \
              '(.data.viewer.zones[0].httpRequestsAdaptiveGroups | type) == "array"' \
              <<< "$response" >/dev/null; then
              echo "Cloudflare returned no Analytics dataset; check token analytics scope." >&2
              jq '{data}' <<< "$response" >&2
              exit 1
            fi
            if jq --exit-status \
              '(.data.viewer.zones[0].httpRequestsAdaptiveGroups | length) == 0' \
              <<< "$response" >/dev/null; then
              daily_visits=0
            elif ! daily_visits="$(jq --exit-status --raw-output \
              '.data.viewer.zones[0].httpRequestsAdaptiveGroups[0].sum.visits | select(type == "number")' \
              <<< "$response")"; then
              echo "Cloudflare returned invalid visit data for ${start} to ${end}." >&2
              jq '{data}' <<< "$response" >&2
              exit 1
            fi
            visits_total="$(jq --null-input --argjson total "$visits_total" --argjson daily "$daily_visits" '$total + $daily')"
          done

          mkdir -p assets/data
          jq --null-input --argjson visits "$visits_total" \
            --arg updatedAt "$(date --utc --iso-8601=seconds)" \
            --argjson periodDays "$period_days" \
            '{visits: ($visits | round), periodDays: $periodDays, updatedAt: $updatedAt}' > assets/data/visits.json

      - name: Commit updated statistics
        run: |
          set -euo pipefail
          git add assets/data/visits.json
          if git diff --cached --quiet -- assets/data/visits.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Cloudflare visits"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
