name: Update Cloudflare Requests

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-commit
  cancel-in-progress: false

jobs:
  update-requests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Cloudflare HTTP requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUDFLARE_ZONE_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "CLOUDFLARE_ZONE_ID must be the 32-character Zone ID for qulishen.top." >&2
            exit 1
          fi

          start="$(date --utc --date='30 days ago + 5 minutes' '+%Y-%m-%dT%H:%M:%SZ')"
          end="$(date --utc '+%Y-%m-%dT%H:%M:%SZ')"
          query='query RecentRequests($zoneTag: string, $start: Time, $end: Time) {
            viewer {
              zones(filter: { zoneTag: $zoneTag }) {
                httpRequestsAdaptiveGroups(
                  limit: 1
                  filter: {
                    datetime_geq: $start
                    datetime_lt: $end
                    requestSource: "eyeball"
                  }
                ) {
                  count
                }
              }
            }
          }'
          payload="$(jq -n \
            --arg query "$query" \
            --arg zoneTag "$CLOUDFLARE_ZONE_ID" \
            --arg start "$start" \
            --arg end "$end" \
            '{query: $query, variables: {zoneTag: $zoneTag, start: $start, end: $end}}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST "https://api.cloudflare.com/client/v4/graphql" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload")"
          if ! requests="$(jq --exit-status --raw-output \
            '.data.viewer.zones[0].httpRequestsAdaptiveGroups[0].count' <<< "$response")"; then
            jq '{errors}' <<< "$response" >&2
            exit 1
          fi

          mkdir -p assets/data
          jq --null-input --argjson requests "$requests" \
            --arg updatedAt "$(date --utc --iso-8601=seconds)" \
            '{requests: $requests, periodDays: 30, updatedAt: $updatedAt}' > assets/data/visits.json

      - name: Commit updated statistics
        run: |
          set -euo pipefail
          git add assets/data/visits.json
          if git diff --cached --quiet -- assets/data/visits.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Cloudflare request statistics"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
