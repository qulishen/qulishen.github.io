name: Update Cloudflare Visits

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cloudflare-visits
  cancel-in-progress: false

jobs:
  update-visits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch recent Cloudflare visits
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail

          start="$(date --utc --date='30 days ago + 5 minutes' '+%Y-%m-%dT%H:%M:%SZ')"
          end="$(date --utc '+%Y-%m-%dT%H:%M:%SZ')"
          query='query RecentVisits($zoneTag: string, $start: Time, $end: Time) {
            viewer {
              zones(filter: { zoneTag: $zoneTag }) {
                httpRequestsAdaptiveGroups(
                  limit: 1
                  filter: {
                    datetime_geq: $start
                    datetime_lt: $end
                    requestSource: "eyeball"
                  }
                ) {
                  sum {
                    visits
                  }
                }
              }
            }
          }'

          payload="$(jq -n \
            --arg query "$query" \
            --arg zoneTag "$CLOUDFLARE_ZONE_ID" \
            --arg start "$start" \
            --arg end "$end" \
            '{query: $query, variables: {zoneTag: $zoneTag, start: $start, end: $end}}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST "https://api.cloudflare.com/client/v4/graphql" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload")"
          if ! visits="$(jq --exit-status --raw-output \
            '.data.viewer.zones[0].httpRequestsAdaptiveGroups[0].sum.visits' \
            <<< "$response")"; then
            jq '{errors}' <<< "$response" >&2
            exit 1
          fi

          jq --null-input --argjson visits "$visits" \
            --arg updatedAt "$(date --utc --iso-8601=seconds)" \
            '{visits: $visits, periodDays: 30, updatedAt: $updatedAt}' > assets/data/visits.json

      - name: Commit updated visits
        run: |
          if git diff --quiet -- assets/data/visits.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/visits.json
          git commit -m "chore: update Cloudflare visit statistics"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
